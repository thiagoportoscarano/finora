services:
  db:
    image: postgres:17-alpine
    container_name: finora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finora}
      POSTGRES_USER: ${POSTGRES_USER:-finora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - finora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finora} -d ${POSTGRES_DB:-finora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: finora-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finora}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-finora}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  finora-postgres-data:
